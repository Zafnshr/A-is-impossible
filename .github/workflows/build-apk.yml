name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses and Prepare SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_output.txt

      - name: Show Diagnostics on Failure
        if: failure()
        run: |
          echo "==================== BUILD FAILURE ANALYSIS ===================="
          grep -n -C 5 -E "(e: |FAILURE:|BUILD FAILED|Caused by:|Exception)" gradle_output.txt || cat gradle_output.txt

      - name: Locate Generated APK
        if: always()
        run: |
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -ls

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A-Plus-Is-Impossible-Debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
